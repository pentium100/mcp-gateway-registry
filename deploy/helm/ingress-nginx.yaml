apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-gateway-registry
spec:
  ingressClassName: nginx
  rules:
    - host: mcpregistry.mcp-gateway.itg.it.org
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: registry
                port:
                  name: http
